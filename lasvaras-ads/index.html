<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Las Flores</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  img{max-width:100%;height:auto;display:block}
  a{color:inherit}
  table{border-collapse:collapse}
  h1,h2,h3,p,ul{margin:0}
  :focus-visible{outline:2px solid currentColor;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .gate{--g:#FAF6F4;--p:#FFF;--ln:#E7DCDF;--ik:#221926;--ik2:#584B5D;--ik3:#8B7E90;--ac:#A62C5B;
    background:var(--g);color:var(--ik);min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  @media (prefers-color-scheme:dark){
    .gate{--g:#171220;--p:#211A2B;--ln:#362C43;--ik:#F0E9F0;--ik2:#B5A8BC;--ik3:#877B90;--ac:#E8709C;}
  }
  .card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:34px 32px;
    width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 16px 40px -20px rgba(34,25,38,.3);}
  .card .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ik3);}
  .card h1{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-size:25px;font-weight:400;
    line-height:1.2;letter-spacing:-.01em;}
  .card p{font-size:13.5px;color:var(--ik2);line-height:1.5;}
  .card form{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .card input{font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--ln);
    border-radius:8px;background:var(--g);color:var(--ik);width:100%;}
  .card input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:transparent;}
  .card button{font:inherit;font-size:14.5px;font-weight:600;padding:11px 13px;border:0;
    border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;}
  .card button:hover{filter:brightness(1.08)}
  .card button[disabled]{opacity:.6;cursor:default}
  .err{font-size:13px;color:var(--ac);min-height:18px;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <span class="eyebrow">Flores Las Varas</span>
    <h1>Dashboard Las Flores</h1>
    <p>Este reporte tiene datos comerciales. Escribe la clave para verlo.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Clave" aria-label="Clave" autofocus>
      <button id="btn" type="submit">Entrar</button>
    </form>
    <span class="err" id="err" role="status" aria-live="polite"></span>
  </div>
</div>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('pw').value.trim().toLowerCase();
  if (!pass) return;
  $('btn').disabled = true; $('btn').textContent = 'Abriendo…'; $('err').textContent = '';
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b(DATA.s), iterations:250000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b(DATA.i) }, key, b(DATA.c));
    const { head, body } = JSON.parse(new TextDecoder().decode(plain));
    document.head.insertAdjacentHTML('beforeend', head);
    $('gate').remove();
    document.body.insertAdjacentHTML('afterbegin', body);
  } catch {
    $('err').textContent = 'Clave incorrecta.';
    $('btn').disabled = false; $('btn').textContent = 'Entrar';
    $('pw').select();
  }
});
</script>
