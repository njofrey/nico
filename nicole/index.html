<meta charset="utf-8">
<title>Dashboard Nicole</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#F5F4EF; --surface:#FBFAF7; --border:#E0DED4; --ink:#14171A; --ink-soft:#52514E; --green:#193D2C; --sand:#D9B48A; --err:#d03b3b; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0E0F11; --surface:#17191C; --border:#2C2F33; --ink:#F2F1EC; --ink-soft:#C3C2B7; --green:#2F6B50; } }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .gate{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
        border-radius:16px;padding:36px 30px;text-align:center}
  .mark{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:20px}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:25px;margin:0 0 8px;line-height:1.25}
  p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px}
  input{width:100%;padding:13px 15px;font-size:15px;border:1px solid var(--border);border-radius:9px;
        background:var(--bg);color:var(--ink);margin-bottom:12px;font-family:inherit}
  input:focus{outline:2px solid var(--green);outline-offset:1px}
  button{width:100%;padding:13px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
         border:none;border-radius:9px;background:var(--green);color:#fff;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:13px;min-height:19px;margin-top:12px}
</style>

<div class="gate" id="gate">
  <div class="mark">Nicole Laurence Banquetería</div>
  <h1>Dashboard Nicole</h1>
  <p class="sub">Campañas y cotizaciones · mayo a agosto 2026<br>Contenido privado.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Clave de acceso" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>

});
